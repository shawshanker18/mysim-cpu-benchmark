name: MySim remote Unity source inventory
on:
  workflow_dispatch:
    inputs:
      project_sha256:
        description: SHA256 of the private catalogue-only or complete source snapshot
        required: true
permissions:
  contents: read
concurrency:
  group: mysim-unity-integration
  cancel-in-progress: false
env:
  PYTHONPATH: unity-pipeline/tools
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Set absolute compute deadline
        id: budget
        run: echo "deadline=$(( $(date +%s) + 16200 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: unity-pipeline
          persist-credentials: false
      - name: Require one authorized Unity CI activation
        env:
          LICENSE_SLOTS: ${{ vars.MYSIM_UNITY_LICENSE_SLOTS }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        run: |
          python3 - <<'PY'
          import os
          assert int(os.environ.get('LICENSE_SLOTS') or '0')>=1,'Configure authorized CI license slots first'
          assert os.environ['UNITY_LICENSING_SERVER'] or ((os.environ['UNITY_LICENSE'] or os.environ['UNITY_SERIAL']) and os.environ['UNITY_EMAIL'] and os.environ['UNITY_PASSWORD']),'Unity CI activation is missing'
          PY
      - name: Start remote resource watchdog
        run: nohup sudo python3 unity-pipeline/tools/resource_watch.py --deadline "${{ steps.budget.outputs.deadline }}" --report /tmp/mysim-resource-watch.json >/tmp/mysim-resource-watch.log 2>&1 &
      - name: Prepare private source-only snapshot on runner
        timeout-minutes: 30
        env:
          MYSIM_PROJECT_URL: ${{ secrets.MYSIM_CATALOG_PROJECT_URL }}
          PROJECT_SHA: ${{ inputs.project_sha256 }}
        run: python3 unity-pipeline/tools/ci.py project --output project --sha "$PROJECT_SHA"
      - name: Inventory source mesh GUIDs, fileIDs, UV channels and bounds remotely
        timeout-minutes: 240
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: project
          unityVersion: 6000.3.26f1
          targetPlatform: StandaloneLinux64
          versioning: None
          buildMethod: MySim.Remote.RemoteCI.Run
          unityLicensingServer: ${{ secrets.UNITY_LICENSING_SERVER }}
          customParameters: -nographics -mysimStage inventory -mysimOutputRoot /github/workspace/unity-out
      - name: Seal source catalogue
        run: python3 unity-pipeline/tools/ci.py seal --directory unity-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unity-source-inventory
          path: unity-out
          if-no-files-found: warn
          retention-days: 7
